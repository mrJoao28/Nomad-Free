# Desenvolvimento local: aplicação (Next.js) + PostgreSQL.
# Uso: cp .env.example .env && docker compose up --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nomadfree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-nomadfree}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-nomadfree_test}
    volumes:
      - nomadfree_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Exposto SOMENTE em loopback (127.0.0.1) para ferramentas locais (Prisma Studio, testes no host).
    # Remova este bloco se não precisar acessar o banco fora do Docker.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro do Compose o host do banco é "db" (não localhost).
      DATABASE_URL: postgresql://${POSTGRES_USER:-nomadfree}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nomadfree}?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next_cache:/app/.next
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  nomadfree_pgdata:
  app_node_modules:
  app_next_cache:
