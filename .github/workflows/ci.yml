name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral-password
          POSTGRES_DB: nomadfree_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d nomadfree_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciais descartáveis do serviço PostgreSQL efêmero acima (não são segredos reais).
      DATABASE_URL: postgresql://ci:ci-ephemeral-password@localhost:5432/nomadfree_test?schema=public
      TEST_DATABASE_URL: postgresql://ci:ci-ephemeral-password@localhost:5432/nomadfree_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
